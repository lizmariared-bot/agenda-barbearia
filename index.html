<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda da Barbearia - Controle Interno</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-md mx-auto px-4 py-4 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <i data-lucide="scissors" class="w-6 h-6 text-amber-500"></i>
        <h1 class="font-bold text-lg text-slate-100">Painel da Barbeira</h1>
      </div>
      <div id="status-badge" class="flex items-center gap-1.5 text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2.5 py-1 rounded-full font-medium">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        Whats Conectado
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 pt-6 space-y-6">

    <!-- Card de Formulário de Agendamento -->
    <section class="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl">
      <h2 class="text-base font-semibold text-slate-200 mb-4 flex items-center gap-2">
        <i data-lucide="calendar-plus" class="w-5 h-5 text-amber-500"></i> Novo Agendamento
      </h2>

      <form id="form-agendamento" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Nome do Cliente</label>
          <input type="text" id="nome" required placeholder="Ex: João Silva" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">WhatsApp (DDD + Número)</label>
          <input type="tel" id="whatsapp" required placeholder="Ex: 35999998888" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Data</label>
            <input type="date" id="data" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Horário</label>
            <input type="time" id="hora" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Serviço</label>
          <select id="servico" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-amber-500 transition">
            <option value="Corte de Cabelo">Corte de Cabelo (R$ 35)</option>
            <option value="Barba Completa">Barba Completa (R$ 25)</option>
            <option value="Combo Corte + Barba">Combo Corte + Barba (R$ 55)</option>
          </select>
        </div>

        <button type="submit" id="btn-submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-amber-500/10">
          <i data-lucide="send" class="w-4 h-4"></i> Agendar e Notificar
        </button>
      </form>
    </section>

    <!-- Lista dos Agendamentos do Dia -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h3 class="font-semibold text-slate-300 text-sm flex items-center gap-2">
          <i data-lucide="clock" class="w-4 h-4 text-amber-500"></i> Agendamentos do Dia
        </h3>
        <button onclick="carregarAgendamentos()" class="text-xs text-amber-500 hover:underline">Atualizar</button>
      </div>

      <div id="lista-agendamentos" class="space-y-2.5">
        <!-- Itens injetados via JavaScript -->
        <div class="text-center py-8 text-slate-500 text-sm">Carregando horários...</div>
      </div>
    </section>

  </main>

  <script>
    // Inicializa os Ícones
    lucide.createIcons();

    // Configurações do Supabase & Evolution API
    const SUPABASE_URL = "https://dhrtesrpaoflhffpxcbh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_oTy_bhppUfuCLgXFHx-ALw_2UfcHohz";
    const EVOLUTION_API_URL = "SUA_URL_DA_EVOLUTION_API_NO_KOYEB";
    const EVOLUTION_API_KEY = "SUA_API_KEY_DA_EVOLUTION";
    const INSTANCE_NAME = "StudioD";

    // Cliente Supabase (Instanciado com nome único para evitar conflitos)
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Ajusta a data do input para HOJE por padrão
    document.getElementById('data').value = new Date().toISOString().split('T')[0];

    // Envio do Formulário
    document.getElementById('form-agendamento').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.innerHTML = `Processando...`;

      const nome = document.getElementById('nome').value;
      let whatsapp = document.getElementById('whatsapp').value.replace(/\D/g, '');
      if (!whatsapp.startsWith('55')) whatsapp = '55' + whatsapp;

      const data = document.getElementById('data').value;
      const hora = document.getElementById('hora').value;
      const servico = document.getElementById('servico').value;
      const dataHorario = `${data}T${hora}:00`;

      try {
        // 1. Salva no Supabase
        const { data: dbData, error } = await supabaseClient
          .from('agendamentos')
          .insert([{ nome_cliente: nome, whatsapp, data_horario: dataHorario, servico, lembrete_enviado: false }]);

        if (error) throw error;

        // 2. Dispara a mensagem de Confirmação via Evolution API (se configurada)
        if (EVOLUTION_API_URL && !EVOLUTION_API_URL.includes("SUA_URL")) {
          const mensagem = `Olá, *${nome}*! 👋\nSeu horário para *${servico}* foi agendado com sucesso!\n\n📅 Data: *${data.split('-').reverse().join('/')}*\n⏰ Horário: *${hora}*\n\nTe esperamos na barbearia! ✂️`;

          await fetch(`${EVOLUTION_API_URL}/message/sendText/${INSTANCE_NAME}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'apikey': EVOLUTION_API_KEY
            },
            body: JSON.stringify({
              number: whatsapp,
              text: mensagem
            })
          });
        }

        alert('Agendamento salvo com sucesso!');
        document.getElementById('form-agendamento').reset();
        document.getElementById('data').value = new Date().toISOString().split('T')[0];
        carregarAgendamentos();

      } catch (err) {
        alert('Erro ao agendar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i data-lucide="send" class="w-4 h-4"></i> Agendar e Notificar`;
        lucide.createIcons();
      }
    });

    // Busca e Exibe os Agendamentos
    async function carregarAgendamentos() {
      const container = document.getElementById('lista-agendamentos');
      
      try {
        const { data, error } = await supabaseClient
          .from('agendamentos')
          .select('*')
          .order('data_horario', { ascending: true });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = `<div class="bg-slate-800 border border-slate-700/50 rounded-xl p-4 text-center text-slate-400 text-xs">Nenhum agendamento encontrado.</div>`;
          return;
        }

        container.innerHTML = data.map(item => {
          const dt = new Date(item.data_horario);
          const horaStr = dt.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
          const dataStr = dt.toLocaleDateString('pt-BR');

          return `
            <div class="bg-slate-800 border border-slate-700/60 rounded-xl p-3.5 flex justify-between items-center">
              <div>
                <div class="font-semibold text-sm text-slate-100">${item.nome_cliente}</div>
                <div class="text-xs text-slate-400 flex items-center gap-1.5 mt-0.5">
                  <span>${item.servico}</span> • <span class="text-amber-400 font-medium">${horaStr}</span> (${dataStr})
                </div>
              </div>
              <div class="text-right">
                <span class="text-[10px] px-2 py-0.5 rounded-full font-medium ${item.lembrete_enviado ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}">
                  ${item.lembrete_enviado ? 'Lembrete Enviado' : 'Aguardando 2h'}
                </span>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        container.innerHTML = `<div class="bg-slate-800 border border-red-500/30 rounded-xl p-4 text-center text-red-400 text-xs">Erro ao carregar dados do Supabase. Verifique a tabela no banco.</div>`;
      }
    }

    // Carrega a lista assim que abre a página
    carregarAgendamentos();
  </script>
</body>
</html>
